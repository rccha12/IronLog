<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#171410">
<title>IRONLOG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;0,6..96,900;1,6..96,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #171410;
  --ink-2: #221d18;
  --ink-3: #2e2822;
  --bone: #f1ead9;
  --bone-2: #e6dfca;
  --paper: #faf6ec;
  --rust: #a83218;
  --rust-dark: #7a2210;
  --olive: #5d6644;
  --gold: #c9a23a;
  --line: rgba(23, 20, 16, 0.18);
  --line-strong: rgba(23, 20, 16, 0.5);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { overscroll-behavior: none; }

body {
  font-family: 'JetBrains Mono', monospace;
  background: var(--bone);
  color: var(--ink);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.5;
  background-image:
    radial-gradient(circle at 0% 0%, rgba(168, 50, 24, 0.04), transparent 50%),
    radial-gradient(circle at 100% 100%, rgba(93, 102, 68, 0.05), transparent 50%);
  padding-bottom: 90px;
}

/* Subtle paper grain */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0.4;
  z-index: 1;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 0.09 0 0 0 0 0.08 0 0 0 0 0.06 0 0 0 0.08 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

#app { position: relative; z-index: 2; max-width: 520px; margin: 0 auto; }

/* HEADER */
header {
  padding: 28px 20px 18px;
  border-bottom: 1px solid var(--ink);
  background: var(--bone);
  position: sticky;
  top: 0;
  z-index: 10;
}
header::after {
  content: '';
  display: block;
  height: 3px;
  background: var(--ink);
  margin-top: 4px;
  position: absolute;
  left: 20px;
  right: 20px;
  bottom: -4px;
}

.brand {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}
.brand-mark {
  font-family: 'Bodoni Moda', serif;
  font-weight: 900;
  font-size: 36px;
  letter-spacing: -0.02em;
  line-height: 0.9;
}
.brand-mark em {
  font-style: italic;
  font-weight: 400;
  color: var(--rust);
}
.brand-meta {
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  text-align: right;
  opacity: 0.6;
  line-height: 1.3;
}
.tagline {
  font-family: 'Bodoni Moda', serif;
  font-style: italic;
  font-size: 13px;
  margin-top: 6px;
  opacity: 0.7;
}

/* NAV TABS */
nav.tabs {
  display: flex;
  border-bottom: 1px solid var(--ink);
  background: var(--bone);
  position: sticky;
  top: 0;
  z-index: 9;
}
.tab {
  flex: 1;
  padding: 14px 8px;
  background: transparent;
  border: none;
  border-right: 1px solid var(--line);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  font-weight: 500;
  cursor: pointer;
  color: var(--ink);
  transition: background 0.15s;
  position: relative;
}
.tab:last-child { border-right: none; }
.tab[aria-current="true"] {
  background: var(--ink);
  color: var(--bone);
}
.tab[aria-current="true"]::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--rust);
}

/* MAIN CONTENT */
main { padding: 20px; }

/* SECTION HEADERS */
.sec-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--ink);
}
.sec-num {
  font-family: 'Bodoni Moda', serif;
  font-style: italic;
  font-weight: 400;
  font-size: 12px;
  color: var(--rust);
  letter-spacing: 0.02em;
}
.sec-title {
  font-family: 'Bodoni Moda', serif;
  font-weight: 900;
  font-size: 26px;
  letter-spacing: -0.01em;
  line-height: 1;
}
.sec-sub {
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  opacity: 0.6;
}

/* CARDS */
.card {
  background: var(--paper);
  border: 1px solid var(--ink);
  margin-bottom: 14px;
  position: relative;
}
.card-head {
  padding: 12px 14px;
  border-bottom: 1px solid var(--ink);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bone-2);
}
.card-title {
  font-family: 'Bodoni Moda', serif;
  font-weight: 700;
  font-size: 17px;
  letter-spacing: -0.01em;
}
.card-meta {
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  opacity: 0.65;
}
.card-body { padding: 14px; }

/* BUTTONS */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 12px 18px;
  background: var(--ink);
  color: var(--bone);
  border: 1px solid var(--ink);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  cursor: pointer;
  transition: transform 0.08s, background 0.15s;
  text-decoration: none;
  width: 100%;
}
.btn:active { transform: translateY(1px); }
.btn-rust { background: var(--rust); border-color: var(--rust); }
.btn-rust:active { background: var(--rust-dark); }
.btn-ghost { background: transparent; color: var(--ink); }
.btn-ghost:active { background: var(--ink); color: var(--bone); }
.btn-sm { padding: 8px 12px; font-size: 10px; letter-spacing: 0.14em; }
.btn-row { display: flex; gap: 8px; margin-top: 12px; }
.btn-row .btn { flex: 1; }

/* INPUTS */
.field { margin-bottom: 12px; }
.field-label {
  display: block;
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-bottom: 6px;
  opacity: 0.7;
  font-weight: 500;
}
.input {
  width: 100%;
  padding: 12px 14px;
  background: var(--paper);
  border: 1px solid var(--ink);
  font-family: 'JetBrains Mono', monospace;
  font-size: 16px;
  font-weight: 500;
  color: var(--ink);
  border-radius: 0;
  outline: none;
  transition: background 0.1s;
}
.input:focus { background: var(--bone-2); }
.input-num { text-align: center; font-size: 18px; font-weight: 700; }

/* ONBOARDING */
.onboard-hero {
  text-align: center;
  padding: 30px 0 20px;
}
.onboard-hero .label {
  font-family: 'Bodoni Moda', serif;
  font-style: italic;
  color: var(--rust);
  font-size: 13px;
  margin-bottom: 8px;
}
.onboard-hero h1 {
  font-family: 'Bodoni Moda', serif;
  font-weight: 900;
  font-size: 44px;
  line-height: 1;
  letter-spacing: -0.02em;
  margin-bottom: 12px;
}
.onboard-hero p {
  font-size: 12px;
  opacity: 0.75;
  line-height: 1.6;
  max-width: 380px;
  margin: 0 auto;
}
.onboard-step-marker {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin: 20px 0 24px;
}
.step-dot {
  width: 26px;
  height: 4px;
  background: var(--line-strong);
}
.step-dot.active { background: var(--rust); }
.step-dot.done { background: var(--ink); }

.exercise-input-row {
  display: grid;
  grid-template-columns: 1fr 90px;
  gap: 8px;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px dashed var(--line);
}
.exercise-input-row:last-child { border-bottom: none; }
.exercise-input-row .name {
  font-size: 13px;
  font-weight: 500;
}
.exercise-input-row .target {
  font-size: 10px;
  opacity: 0.6;
  margin-top: 2px;
  letter-spacing: 0.05em;
}
.unit-toggle {
  display: inline-flex;
  border: 1px solid var(--ink);
  margin-left: 10px;
}
.unit-toggle button {
  padding: 6px 10px;
  background: transparent;
  border: none;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  cursor: pointer;
  color: var(--ink);
}
.unit-toggle button.active {
  background: var(--ink);
  color: var(--bone);
}

/* HOME / DAY PICKER */
.day-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 18px;
}
.day-card {
  background: var(--paper);
  border: 1px solid var(--ink);
  padding: 14px;
  cursor: pointer;
  text-align: left;
  font-family: 'JetBrains Mono', monospace;
  position: relative;
  transition: transform 0.1s;
}
.day-card:active { transform: scale(0.98); }
.day-card.recommended {
  background: var(--ink);
  color: var(--bone);
  border-color: var(--ink);
}
.day-card.recommended::after {
  content: 'NEXT';
  position: absolute;
  top: 6px;
  right: 8px;
  font-size: 8px;
  letter-spacing: 0.2em;
  color: var(--rust);
  font-weight: 700;
}
.day-card .day-num {
  font-family: 'Bodoni Moda', serif;
  font-style: italic;
  font-size: 11px;
  opacity: 0.6;
}
.day-card .day-name {
  font-family: 'Bodoni Moda', serif;
  font-weight: 700;
  font-size: 18px;
  line-height: 1.1;
  margin-top: 4px;
  letter-spacing: -0.01em;
}
.day-card .day-focus {
  font-size: 9px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-top: 6px;
  opacity: 0.7;
}

.streak-row {
  display: flex;
  justify-content: space-between;
  background: var(--ink);
  color: var(--bone);
  padding: 14px 16px;
  margin-bottom: 14px;
  border: 1px solid var(--ink);
}
.streak-stat .num {
  font-family: 'Bodoni Moda', serif;
  font-weight: 900;
  font-size: 26px;
  line-height: 1;
}
.streak-stat .lbl {
  font-size: 8px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  opacity: 0.6;
  margin-top: 2px;
}
.streak-stat.accent .num { color: var(--gold); }

/* WORKOUT VIEW */
.workout-header {
  margin-bottom: 18px;
}
.workout-header .day-tag {
  font-family: 'Bodoni Moda', serif;
  font-style: italic;
  color: var(--rust);
  font-size: 13px;
}
.workout-header h2 {
  font-family: 'Bodoni Moda', serif;
  font-weight: 900;
  font-size: 32px;
  line-height: 1;
  letter-spacing: -0.02em;
  margin-top: 4px;
}
.workout-header .subtitle {
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-top: 8px;
  opacity: 0.65;
}

.exercise-block {
  background: var(--paper);
  border: 1px solid var(--ink);
  margin-bottom: 14px;
  overflow: hidden;
}
.exercise-block.completed { opacity: 0.65; }
.exercise-head {
  padding: 12px 14px;
  background: var(--bone-2);
  border-bottom: 1px solid var(--ink);
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}
.exercise-head .num-badge {
  font-family: 'Bodoni Moda', serif;
  font-style: italic;
  font-size: 11px;
  color: var(--rust);
  margin-bottom: 2px;
}
.exercise-head .ex-name {
  font-family: 'Bodoni Moda', serif;
  font-weight: 700;
  font-size: 18px;
  line-height: 1.1;
  letter-spacing: -0.01em;
}
.exercise-head .ex-target {
  font-size: 9px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  opacity: 0.65;
  margin-top: 4px;
}
.exercise-head .prescribe {
  text-align: right;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}
.exercise-head .prescribe .sets-reps {
  font-family: 'Bodoni Moda', serif;
  font-weight: 900;
  font-size: 22px;
  line-height: 1;
}
.exercise-head .prescribe .at-load {
  font-size: 10px;
  opacity: 0.7;
  margin-top: 2px;
  letter-spacing: 0.05em;
}

.failure-tag {
  display: inline-block;
  background: var(--rust);
  color: var(--bone);
  font-size: 8px;
  letter-spacing: 0.2em;
  padding: 2px 6px;
  margin-top: 6px;
  font-weight: 700;
}
.note-line {
  padding: 8px 14px;
  background: var(--paper);
  font-size: 10px;
  font-style: italic;
  font-family: 'Bodoni Moda', serif;
  border-bottom: 1px solid var(--line);
  opacity: 0.75;
}

.set-list { padding: 4px 14px 14px; }
.set-row {
  display: grid;
  grid-template-columns: 24px 1fr 1fr 32px;
  gap: 8px;
  align-items: center;
  padding: 6px 0;
  border-bottom: 1px dashed var(--line);
}
.set-row:last-child { border-bottom: none; }
.set-num {
  font-family: 'Bodoni Moda', serif;
  font-style: italic;
  font-weight: 700;
  font-size: 14px;
  color: var(--rust);
  text-align: center;
}
.set-input {
  width: 100%;
  padding: 8px 6px;
  border: 1px solid var(--ink);
  background: var(--bone);
  font-family: 'JetBrains Mono', monospace;
  font-size: 15px;
  font-weight: 700;
  text-align: center;
  outline: none;
  border-radius: 0;
  color: var(--ink);
  -moz-appearance: textfield;
}
.set-input::-webkit-outer-spin-button,
.set-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.set-input::placeholder { font-weight: 400; opacity: 0.4; }
.set-input:focus { background: var(--paper); border-color: var(--rust); }
.set-input.beat { background: #e8efd7; }
.set-input.miss { background: #f5dcd2; }
.set-check {
  width: 28px;
  height: 28px;
  border: 1px solid var(--ink);
  background: var(--paper);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 13px;
  color: var(--ink);
  padding: 0;
}
.set-check.done {
  background: var(--ink);
  color: var(--bone);
}

.set-headers {
  display: grid;
  grid-template-columns: 24px 1fr 1fr 32px;
  gap: 8px;
  padding: 6px 0;
  border-bottom: 1px solid var(--ink);
  margin-bottom: 4px;
}
.set-headers span {
  font-size: 8px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  text-align: center;
  opacity: 0.65;
  font-weight: 500;
}
.set-headers span:first-child { text-align: left; padding-left: 2px; }

.exercise-foot {
  padding: 10px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid var(--line);
  background: var(--bone);
  font-size: 10px;
  letter-spacing: 0.05em;
}
.exercise-foot .last-time {
  opacity: 0.6;
  font-style: italic;
  font-family: 'Bodoni Moda', serif;
  font-size: 11px;
}
.lvlup {
  background: var(--gold);
  color: var(--ink);
  padding: 4px 8px;
  font-size: 9px;
  letter-spacing: 0.18em;
  font-weight: 700;
  text-transform: uppercase;
}

/* TIMER */
.rest-timer {
  position: fixed;
  bottom: 86px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--bone);
  padding: 12px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  z-index: 30;
  border: 1px solid var(--rust);
  width: calc(100% - 40px);
  max-width: 480px;
  justify-content: space-between;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}
.rest-timer .time {
  font-family: 'Bodoni Moda', serif;
  font-weight: 900;
  font-size: 28px;
  letter-spacing: -0.01em;
}
.rest-timer .lbl {
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  opacity: 0.7;
}
.rest-timer button {
  background: transparent;
  border: 1px solid var(--bone);
  color: var(--bone);
  padding: 6px 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.15em;
  font-weight: 700;
  cursor: pointer;
}

/* BOTTOM NAV */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--ink);
  color: var(--bone);
  display: flex;
  z-index: 20;
  border-top: 3px solid var(--rust);
  max-width: 520px;
  margin: 0 auto;
}
.bnav {
  flex: 1;
  padding: 14px 6px;
  background: transparent;
  border: none;
  border-right: 1px solid rgba(241, 234, 217, 0.15);
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 500;
  cursor: pointer;
  color: var(--bone);
  opacity: 0.55;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.bnav:last-child { border-right: none; }
.bnav.active { opacity: 1; }
.bnav.active .bnav-icon { color: var(--rust); }
.bnav-icon {
  font-family: 'Bodoni Moda', serif;
  font-style: italic;
  font-weight: 700;
  font-size: 18px;
  line-height: 1;
}

/* ANALYTICS */
.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 18px;
}
.stat-tile {
  background: var(--paper);
  border: 1px solid var(--ink);
  padding: 14px;
  position: relative;
}
.stat-tile.dark {
  background: var(--ink);
  color: var(--bone);
}
.stat-tile .stat-lbl {
  font-size: 8px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  opacity: 0.6;
  margin-bottom: 6px;
}
.stat-tile .stat-num {
  font-family: 'Bodoni Moda', serif;
  font-weight: 900;
  font-size: 32px;
  line-height: 0.9;
  letter-spacing: -0.02em;
}
.stat-tile .stat-unit {
  font-family: 'Bodoni Moda', serif;
  font-style: italic;
  font-size: 12px;
  opacity: 0.7;
  margin-left: 4px;
  font-weight: 400;
}
.stat-tile .stat-sub {
  font-size: 9px;
  margin-top: 4px;
  letter-spacing: 0.05em;
  opacity: 0.7;
}

.bar-row {
  display: grid;
  grid-template-columns: 90px 1fr 50px;
  gap: 10px;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px dashed var(--line);
}
.bar-row:last-child { border-bottom: none; }
.bar-row .label {
  font-size: 11px;
  font-weight: 500;
}
.bar-track {
  height: 16px;
  background: var(--bone-2);
  border: 1px solid var(--ink);
  position: relative;
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  background: var(--ink);
  position: relative;
  transition: width 0.4s;
}
.bar-fill.in-range { background: var(--olive); }
.bar-fill.over { background: var(--gold); }
.bar-fill.under { background: var(--rust); }
.bar-target {
  position: absolute;
  top: -2px;
  bottom: -2px;
  width: 1px;
  background: var(--ink);
  border-left: 1px dashed var(--ink);
}
.bar-row .val {
  font-family: 'Bodoni Moda', serif;
  font-weight: 700;
  font-size: 13px;
  text-align: right;
}

.flag-list { }
.flag-item {
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.flag-item:last-child { border-bottom: none; }
.flag-icon {
  font-family: 'Bodoni Moda', serif;
  font-style: italic;
  font-weight: 900;
  font-size: 22px;
  line-height: 1;
  width: 28px;
  flex-shrink: 0;
  text-align: center;
}
.flag-icon.warn { color: var(--rust); }
.flag-icon.good { color: var(--olive); }
.flag-icon.up { color: var(--gold); }
.flag-text {
  flex: 1;
}

}

/* HISTORY */

  margin-bottom: 10px;

/* MODAL */

  border-top: 4px solid var(--rust);

  max-width: 520px;
  margin: 0 auto;
  padding: 24px 20px;
  max-height: 90vh;
  overflow-y: auto;
}
.modal h3 {
  font-family: 'Bodoni Moda', serif;
  font-weight: 900;
  font-size: 22px;
  letter-spacing: -0.01em;
  margin-bottom: 4px;
}

  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  opacity: 0.6;
  margin-bottom: 16px;
}

/* TOAST */
.toast {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--bone);
  padding: 12px 18px;
  font-size: 11px;
  letter-spacing: 0.1em;
  z-index: 200;

  font-family: 'Bodoni Moda', serif;

@keyframes pulse-rust {

<body>

<div id="app"></div>

<script>
// ============================================================================
// IRONLOG — A 4-day Push/Pull hybrid hypertrophy tracker
// ============================================================================

const STORAGE_KEY = 'ironlog_v1';

// ---------------------------------------------------------------------------
// PROGRAM DEFINITION — based on ACSM 2026 Position Stand evidence
// Upper body gets full volume; 2 lower body exercises per day
// ---------------------------------------------------------------------------
const PROGRAM = {
  push_a: {
    id: 'push_a',
    name: 'Push A',
    focus: 'Upper Push + Lower Pull',
    exercises: [
      // Upper Push (5 exercises = full volume)
      { id: 'bb_bench', name: 'Barbell Bench Press', target: 'Chest / Front Delt / Tri', sets: 4, repLow: 6, repHigh: 8, restSec: 180, note: 'Compound. Heavier load. Stop 1–2 reps short of failure.', failure: false, category: 'upper_push' },
      { id: 'inc_db_press', name: 'Incline Dumbbell Press', target: 'Upper Chest / Front Delt', sets: 3, repLow: 8, repHigh: 12, restSec: 120, note: 'Full ROM. 3-second eccentric (lowering).', failure: false, category: 'upper_push' },
      { id: 'ohp', name: 'Overhead Press', target: 'Delts / Triceps', sets: 3, repLow: 8, repHigh: 10, restSec: 150, note: 'Vertical push. Barbell or dumbbell.', failure: false, category: 'upper_push' },
      { id: 'lat_raise_a', name: 'Cable Lateral Raise', target: 'Lateral Delt', sets: 3, repLow: 12, repHigh: 15, restSec: 75, note: 'Constant tension. Last set to failure.', failure: true, failureSet: 3, category: 'upper_push' },
      { id: 'tri_pushdown', name: 'Tricep Pushdown', target: 'Triceps', sets: 3, repLow: 10, repHigh: 15, restSec: 75, note: 'Single-joint. Last set to failure.', failure: true, failureSet: 3, category: 'upper_push' },
      // Lower Pull (2 exercises)
      { id: 'rdl', name: 'Romanian Deadlift', target: 'Hamstrings / Glutes', sets: 3, repLow: 8, repHigh: 10, restSec: 150, note: 'Hip-hinge. Hamstring stretch at bottom.', failure: false, category: 'lower_pull' },
      { id: 'leg_curl', name: 'Lying Leg Curl', target: 'Hamstrings (biceps femoris)', sets: 3, repLow: 10, repHigh: 12, restSec: 90, note: 'Slow eccentric. Last set to failure.', failure: true, failureSet: 3, category: 'lower_pull' }
    ]
  },
  pull_a: {
    id: 'pull_a',
    name: 'Pull A',
    focus: 'Upper Pull + Lower Push',
    exercises: [
      // Upper Pull (5 exercises)
      { id: 'bb_row', name: 'Barbell Row', target: 'Lats / Rhomboids / Rear Delt', sets: 4, repLow: 6, repHigh: 8, restSec: 180, note: 'Horizontal pull. Heavier load. Pendlay or bent-over.', failure: false, category: 'upper_pull' },
      { id: 'pullups', name: 'Pull-ups or Lat Pulldown', target: 'Lats / Biceps', sets: 3, repLow: 8, repHigh: 12, restSec: 120, note: 'Vertical pull. Full ROM, full stretch.', failure: false, category: 'upper_pull' },
      { id: 'cable_row', name: 'Seated Cable Row', target: 'Mid Back / Rhomboids', sets: 3, repLow: 10, repHigh: 12, restSec: 90, note: '3-second eccentric.', failure: false, category: 'upper_pull' },
      { id: 'face_pulls', name: 'Face Pulls', target: 'Rear Delt / External Rotators', sets: 3, repLow: 12, repHigh: 15, restSec: 60, note: 'Shoulder health. Last set to failure.', failure: true, failureSet: 3, category: 'upper_pull' },
      { id: 'bb_curl', name: 'Barbell or Dumbbell Curl', target: 'Biceps', sets: 3, repLow: 10, repHigh: 12, restSec: 75, note: 'Strict form. Last set to failure.', failure: true, failureSet: 3, category: 'upper_pull' },
      // Lower Push (2 exercises)
      { id: 'leg_press', name: 'Leg Press', target: 'Quads / Glutes / Adductors', sets: 3, repLow: 10, repHigh: 12, restSec: 150, note: 'Time-efficient compound. Full ROM.', failure: false, category: 'lower_push' },
      { id: 'leg_ext', name: 'Leg Extension', target: 'Rectus Femoris', sets: 3, repLow: 12, repHigh: 15, restSec: 75, note: 'Targets rectus femoris which leg press misses. Last set to failure.', failure: true, failureSet: 3, category: 'lower_push' }
    ]
  },
  push_b: {
    id: 'push_b',
    name: 'Push B',
    focus: 'Upper Push + Lower Pull (variation)',
    exercises: [
      // Upper Push (5 exercises)
      { id: 'db_bench', name: 'Dumbbell Bench Press', target: 'Chest / Front Delt / Tri', sets: 4, repLow: 8, repHigh: 10, restSec: 150, note: 'Varied stimulus from barbell day.', failure: false, category: 'upper_push' },
      { id: 'cable_fly', name: 'Cable or Machine Fly', target: 'Chest (stretch emphasis)', sets: 3, repLow: 12, repHigh: 15, restSec: 75, note: 'Pause at full stretch. Last set to failure.', failure: true, failureSet: 3, category: 'upper_push' },
      { id: 'db_shoulder_press', name: 'Seated Dumbbell Shoulder Press', target: 'Delts / Triceps', sets: 3, repLow: 8, repHigh: 12, restSec: 120, note: 'Vertical push variation.', failure: false, category: 'upper_push' },
      { id: 'lat_raise_b', name: 'Cable Lateral Raise', target: 'Lateral Delt', sets: 3, repLow: 12, repHigh: 15, restSec: 75, note: 'Repeat exposure for volume. Last set to failure.', failure: true, failureSet: 3, category: 'upper_push' },
      { id: 'dips', name: 'Dips or Close-Grip Bench', target: 'Triceps / Lower Chest', sets: 3, repLow: 8, repHigh: 12, restSec: 120, note: 'Compound tricep. Add weight if too easy.', failure: false, category: 'upper_push' },
      // Lower Pull (2 exercises)
      { id: 'hip_thrust', name: 'Barbell Hip Thrust', target: 'Glutes / Hamstrings', sets: 3, repLow: 8, repHigh: 12, restSec: 120, note: 'Pause 1s at top. Highest glute activation.', failure: false, category: 'lower_pull' },
      { id: 'nordic', name: 'Nordic Hamstring Curl', target: 'Hamstrings (semitendinosus)', sets: 3, repLow: 6, repHigh: 10, restSec: 90, note: 'Eccentric overload. Use band if needed.', failure: false, category: 'lower_pull' }
    ]
  },
  pull_b: {
    id: 'pull_b',
    name: 'Pull B',
    focus: 'Upper Pull + Lower Push (variation)',
    exercises: [
      // Upper Pull (5 exercises)
      { id: 'weighted_pullup', name: 'Weighted Pull-ups / Chin-ups', target: 'Lats / Biceps', sets: 4, repLow: 6, repHigh: 8, restSec: 180, note: 'Heavier vertical pull. Add weight.', failure: false, category: 'upper_pull' },
      { id: 'sa_db_row', name: 'Single-Arm Dumbbell Row', target: 'Lats / Rhomboids', sets: 3, repLow: 8, repHigh: 12, restSec: 90, note: 'Each side. Full ROM stretch.', failure: false, category: 'upper_pull' },
      { id: 'pullover', name: 'Cable Pullover / Straight-Arm Pulldown', target: 'Lats', sets: 3, repLow: 12, repHigh: 15, restSec: 75, note: 'Isolation. Eccentric emphasis. Last set to failure.', failure: true, failureSet: 3, category: 'upper_pull' },
      { id: 'rear_fly', name: 'Reverse Fly (machine or DB)', target: 'Rear Delt', sets: 3, repLow: 12, repHigh: 15, restSec: 60, note: 'Squeeze at top. Last set to failure.', failure: true, failureSet: 3, category: 'upper_pull' },
      { id: 'incline_curl', name: 'Incline Dumbbell Curl', target: 'Biceps (long head)', sets: 3, repLow: 10, repHigh: 12, restSec: 75, note: 'Varied angle. Last set to failure.', failure: true, failureSet: 3, category: 'upper_pull' },
      // Lower Push (2 exercises)
      { id: 'bulgarian', name: 'Bulgarian Split Squat', target: 'Quads / Glutes / Adductors', sets: 3, repLow: 8, repHigh: 12, restSec: 120, note: 'Each leg. High glute activation.', failure: false, category: 'lower_push' },
      { id: 'standing_calf', name: 'Standing Calf Raise', target: 'Gastrocnemius / Soleus', sets: 4, repLow: 10, repHigh: 15, restSec: 75, note: 'Full stretch at bottom. Last set to failure.', failure: true, failureSet: 4, category: 'lower_push' }
    ]
  }
};

const DAY_ORDER = ['push_a', 'pull_a', 'push_b', 'pull_b'];

// ---------------------------------------------------------------------------
// STATE
// ---------------------------------------------------------------------------
let state = {
  onboarded: false,
  unit: 'lb', // 'lb' or 'kg'
  weights: {}, // { exerciseId: number }
  sessions: [], // [{ id, date, dayId, entries: { exId: [{set, weight, reps, done, toFailure}] } }]
  currentSession: null,
  view: 'home',
  onboardStep: 0,
  restTimer: null,
  toast: null
};

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      state = { ...state, ...data, view: 'home', currentSession: null, restTimer: null, toast: null };
    }
  } catch(e) { console.error('load failed', e); }
}

function save() {
  try {
    const toSave = {
      onboarded: state.onboarded,
      unit: state.unit,
      weights: state.weights,
      sessions: state.sessions,
      currentSession: state.currentSession
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
  } catch(e) { console.error('save failed', e); }
}

function showToast(msg, ms = 2200) {
  state.toast = msg;
  render();
  setTimeout(() => {
    if (state.toast === msg) {
      state.toast = null;
      render();
    }
  }, ms);
}

// ---------------------------------------------------------------------------
// HELPERS
// ---------------------------------------------------------------------------
function uniqueExercises() {
  const map = new Map();
  DAY_ORDER.forEach(d => {
    PROGRAM[d].exercises.forEach(ex => {
      if (!map.has(ex.id)) map.set(ex.id, ex);
    });
  });
  return Array.from(map.values());
}

function exerciseById(id) {
  return uniqueExercises().find(e => e.id === id);
}

// Determine which day to recommend next based on history
function recommendedDay() {
  if (state.sessions.length === 0) return 'push_a';
  const last = state.sessions[state.sessions.length - 1];
  const idx = DAY_ORDER.indexOf(last.dayId);
  return DAY_ORDER[(idx + 1) % DAY_ORDER.length];
}

// History of an exercise: most recent session entry
function lastEntryFor(exId, beforeSessionId = null) {
  for (let i = state.sessions.length - 1; i >= 0; i--) {
    const s = state.sessions[i];
    if (beforeSessionId && s.id === beforeSessionId) continue;
    if (s.entries && s.entries[exId]) return { session: s, entry: s.entries[exId] };
  }
  return null;
}

// 2-for-2 rule: if the user beat the top of the rep range by 2+ on the top set
// in two consecutive sessions, suggest a load increase
function shouldLevelUp(exId) {
  const ex = exerciseById(exId);
  if (!ex) return false;
  const past = state.sessions.filter(s => s.entries && s.entries[exId]).slice(-2);
  if (past.length < 2) return false;
  return past.every(s => {
    const sets = s.entries[exId];
    if (!sets || !sets.length) return false;
    // Check if any set hit reps >= repHigh + 2
    return sets.some(set => set.reps && set.reps >= ex.repHigh + 2);
  });
}

function levelUpAmount(exId) {
  const ex = exerciseById(exId);
  // Lower body and compound: 5-10 lb. Upper body isolation: 2-5 lb.
  const isLower = ex.category === 'lower_push' || ex.category === 'lower_pull';
  const isCompound = ['bb_bench','db_bench','ohp','db_shoulder_press','bb_row','pullups','weighted_pullup','rdl','leg_press','hip_thrust','bulgarian','dips'].includes(exId);
  if (isLower || isCompound) return state.unit === 'lb' ? 5 : 2.5;
  return state.unit === 'lb' ? 2.5 : 1;
}

// Weekly volume analysis (sets per muscle group, last 7 days)
function weeklyVolume() {
  const now = Date.now();
  const cutoff = now - 7 * 86400000;
  const muscleSets = {
    'Chest': 0, 'Back': 0, 'Shoulders': 0, 'Biceps': 0, 'Triceps': 0,
    'Quads': 0, 'Hamstrings': 0, 'Glutes': 0, 'Calves': 0
  };
  state.sessions.filter(s => new Date(s.date).getTime() >= cutoff).forEach(s => {
    Object.entries(s.entries || {}).forEach(([exId, sets]) => {
      const ex = exerciseById(exId);
      if (!ex) return;
      const completedSets = sets.filter(x => x.done).length;
      // Map exercises to muscle groups (with indirect contributions)
      const mapping = {
        'bb_bench': { Chest: 1, Triceps: 0.5, Shoulders: 0.3 },
        'db_bench': { Chest: 1, Triceps: 0.5, Shoulders: 0.3 },
        'inc_db_press': { Chest: 1, Shoulders: 0.5, Triceps: 0.4 },
        'cable_fly': { Chest: 1 },
        'ohp': { Shoulders: 1, Triceps: 0.5 },
        'db_shoulder_press': { Shoulders: 1, Triceps: 0.5 },
        'lat_raise_a': { Shoulders: 1 },
        'lat_raise_b': { Shoulders: 1 },
        'tri_pushdown': { Triceps: 1 },
        'dips': { Triceps: 1, Chest: 0.5 },
        'bb_row': { Back: 1, Biceps: 0.5 },
        'pullups': { Back: 1, Biceps: 0.5 },
        'weighted_pullup': { Back: 1, Biceps: 0.5 },
        'cable_row': { Back: 1, Biceps: 0.4 },
        'sa_db_row': { Back: 1, Biceps: 0.4 },
        'pullover': { Back: 1 },
        'face_pulls': { Shoulders: 1, Back: 0.3 },
        'rear_fly': { Shoulders: 1 },
        'bb_curl': { Biceps: 1 },
        'incline_curl': { Biceps: 1 },
        'rdl': { Hamstrings: 1, Glutes: 0.7 },
        'leg_curl': { Hamstrings: 1 },
        'hip_thrust': { Glutes: 1, Hamstrings: 0.5 },
        'nordic': { Hamstrings: 1 },
        'leg_press': { Quads: 1, Glutes: 0.5 },
        'leg_ext': { Quads: 1 },
        'bulgarian': { Quads: 1, Glutes: 0.7 },
        'standing_calf': { Calves: 1 }
      };
      const map = mapping[exId] || {};
      Object.entries(map).forEach(([muscle, weight]) => {
        muscleSets[muscle] += completedSets * weight;
      });
    });
  });
  return muscleSets;
}

// Detect stalling exercises: same weight & similar reps for 3+ consecutive sessions
function findStalling() {
  const stalls = [];
  uniqueExercises().forEach(ex => {
    const entries = state.sessions
      .filter(s => s.entries && s.entries[ex.id])
      .slice(-3)
      .map(s => s.entries[ex.id]);
    if (entries.length < 3) return;
    // Check top weight used in each session (max weight across sets)
    const topWeights = entries.map(sets => Math.max(...sets.filter(x => x.weight).map(x => x.weight)));
    if (topWeights.length === 3 && topWeights[0] === topWeights[1] && topWeights[1] === topWeights[2] && topWeights[0] > 0) {
      stalls.push(ex);
    }
  });
  return stalls;
}

// Detect exercises where user has been beating the rep range (ready to level up)
function findReadyToProgress() {
  return uniqueExercises().filter(ex => shouldLevelUp(ex.id));
}

// Personal records (top weight ever logged per exercise)
function personalRecords() {
  const prs = {};
  state.sessions.forEach(s => {
    Object.entries(s.entries || {}).forEach(([exId, sets]) => {
      sets.forEach(set => {
        if (set.weight && set.reps && set.done) {
          const e1rm = set.weight * (1 + set.reps / 30); // Epley
          if (!prs[exId] || e1rm > prs[exId].e1rm) {
            prs[exId] = { e1rm, weight: set.weight, reps: set.reps, date: s.date };
          }
        }
      });
    });
  });
  return prs;
}

function totalVolume() {
  let total = 0;
  state.sessions.forEach(s => {
    Object.values(s.entries || {}).forEach(sets => {
      sets.forEach(set => {
        if (set.done && set.weight && set.reps) total += set.weight * set.reps;
      });
    });
  });
  return total;
}

function streakCount() {
  if (state.sessions.length === 0) return 0;
  // Sessions in last 14 days, capped to days with workouts
  const days = new Set();
  const now = Date.now();
  state.sessions.forEach(s => {
    const d = new Date(s.date);
    days.add(d.toISOString().slice(0,10));
  });
  // Count consecutive workout days going back from today/most-recent
  return days.size;
}

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function fmtTime(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}

// ---------------------------------------------------------------------------
// VIEWS
// ---------------------------------------------------------------------------
function render() {
  const app = document.getElementById('app');
  let html = '';

  if (!state.onboarded) {
    html = renderOnboarding();
  } else if (state.currentSession) {
    html = renderHeader() + renderWorkout();
  } else {
    html = renderHeader() + renderTabContent();
    html += renderBottomNav();
  }

  if (state.toast) {
    html += `<div class="toast">${state.toast}</div>`;
  }

  app.innerHTML = html;
  attachHandlers();
}

function renderHeader() {
  if (state.currentSession) {
    return `
      <header>
        <div class="brand">
          <div class="brand-mark">IRON<em>log</em></div>
          <div class="brand-meta">SESSION<br>IN PROGRESS</div>
        </div>
      </header>`;
  }
  return `
    <header>
      <div class="brand">
        <div class="brand-mark">IRON<em>log</em></div>
        <div class="brand-meta">EST. ${new Date().getFullYear()}<br>HYPERTROPHY ED.</div>
      </div>
      <div class="tagline">Heavy things, picked up & put down.</div>
    </header>`;
}

function renderBottomNav() {
  return `
    <div class="bottom-nav">
      <button class="bnav ${state.view === 'home' ? 'active' : ''}" data-view="home">
        <span class="bnav-icon">A</span>
        <span>Today</span>
      </button>
      <button class="bnav ${state.view === 'analytics' ? 'active' : ''}" data-view="analytics">
        <span class="bnav-icon">B</span>
        <span>Stats</span>
      </button>
      <button class="bnav ${state.view === 'history' ? 'active' : ''}" data-view="history">
        <span class="bnav-icon">C</span>
        <span>Log</span>
      </button>
      <button class="bnav ${state.view === 'settings' ? 'active' : ''}" data-view="settings">
        <span class="bnav-icon">D</span>
        <span>Setup</span>
      </button>
    </div>`;
}

function renderTabContent() {
  switch(state.view) {
    case 'home': return renderHome();
    case 'analytics': return renderAnalytics();
    case 'history': return renderHistory();
    case 'settings': return renderSettings();
    default: return renderHome();
  }
}

// ---------------------------------------------------------------------------
// ONBOARDING
// ---------------------------------------------------------------------------
function renderOnboarding() {
  if (state.onboardStep === 0) {
    return `
      <header>
        <div class="brand">
          <div class="brand-mark">IRON<em>log</em></div>
          <div class="brand-meta">v 1.0<br>OFFLINE</div>
        </div>
      </header>
      <main>
        <div class="onboard-step-marker">
          <span class="step-dot active"></span>
          <span class="step-dot"></span>
          <span class="step-dot"></span>
        </div>
        <div class="onboard-hero">
          <div class="label">— Welcome —</div>
          <h1>Take the<br>thinking<br>out of it.</h1>
          <p>An evidence-based 4-day push/pull tracker built on the 2026 ACSM Position Stand. Volume, progression, and rep targets — already decided. You just lift.</p>
        </div>
        <div class="card">
          <div class="card-head">
            <div class="card-title">Your Program</div>
            <div class="card-meta">4 DAYS / WK</div>
          </div>
          <div class="card-body" style="font-size:11px; line-height:1.8;">
            <div style="display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px dashed var(--line);">
              <span><strong>Push A</strong></span>
              <span style="opacity:0.7">Upper push + lower pull</span>

function renderWorkout() {
  const session = state.currentSession;
  const day = PROGRAM[session.dayId];
  const totalSets = day.exercises.reduce((sum, ex) => sum + ex.sets, 0);
  let completedSets = 0;
  Object.values(session.entries).forEach(sets => {
    completedSets += sets.filter(x => x.done).length;
  });
  const pct = Math.round((completedSets / totalSets) * 100);

  let timer = '';
  if (state.restTimer && state.restTimer.remaining > 0) {
    const mm = Math.floor(state.restTimer.remaining / 60);
    const ss = state.restTimer.remaining % 60;
    timer = `
      <div class="rest-timer">
        <div>
          <div class="lbl">REST</div>
          <div class="time">${mm}:${ss.toString().padStart(2,'0')}</div>
        </div>
        <button data-action="skip-rest">SKIP</button>
      </div>`;
  }

  return `
    <main>
      <div class="workout-header">
        <div class="day-tag">— ${session.dayId.replace('_',' ').toUpperCase()} —</div>
        <h2>${day.name}</h2>
        <div class="subtitle">${day.focus} · ${completedSets}/${totalSets} SETS · ${pct}%</div>
      </div>

      ${day.exercises.map((ex, idx) => {
        const sets = session.entries[ex.id] || [];
        const allDone = sets.length > 0 && sets.every(x => x.done);
        const last = lastEntryFor(ex.id, session.id);
        const lastWeight = last && last.entry.length ? Math.max(...last.entry.filter(s=>s.weight).map(s=>s.weight)) : null;
        const lastDate = last ? fmtDate(last.session.date) : null;
        const levelUp = shouldLevelUp(ex.id);
        const startWeight = state.weights[ex.id] || lastWeight || '';

        return `
          <div class="exercise-block ${allDone ? 'completed' : ''}">
            <div class="exercise-head">
              <div>
                <div class="num-badge">— exercise ${idx + 1} of ${day.exercises.length} —</div>
                <div class="ex-name">${ex.name}</div>
                <div class="ex-target">${ex.target}</div>
                ${ex.failure ? `<div class="failure-tag">SET ${ex.failureSet} TO FAILURE</div>` : ''}
              </div>
              <div class="prescribe">
                <div class="sets-reps">${ex.sets}×${ex.repLow}–${ex.repHigh}</div>
                <div class="at-load">${ex.restSec}s rest</div>
              </div>
            </div>

            ${ex.note ? `<div class="note-line">"${ex.note}"</div>` : ''}

            <div class="set-list">
              <div class="set-headers">
                <span>SET</span><span>WEIGHT</span><span>REPS</span><span>✓</span>
              </div>
              ${Array.from({length: ex.sets}, (_, i) => {
                const setData = sets[i] || {};
                const isFailureSet = ex.failure && (i + 1) === ex.failureSet;
                const repsClass = setData.reps ? (setData.reps >= ex.repHigh ? 'beat' : (setData.reps < ex.repLow ? 'miss' : '')) : '';
                return `
                  <div class="set-row">
                    <div class="set-num">${i + 1}${isFailureSet ? '*' : ''}</div>
                    <input type="number" class="set-input" data-set-input="${ex.id}|${i}|weight" value="${setData.weight || ''}" placeholder="${startWeight || '–'}" inputmode="decimal">
                    <input type="number" class="set-input ${repsClass}" data-set-input="${ex.id}|${i}|reps" value="${setData.reps || ''}" placeholder="${ex.repLow}–${ex.repHigh}" inputmode="numeric">
                    <button class="set-check ${setData.done ? 'done' : ''}" data-action="toggle-set" data-set="${ex.id}|${i}|${ex.restSec}">${setData.done ? '✓' : ''}</button>
                  </div>`;
              }).join('')}
            </div>

            <div class="exercise-foot">
              <div class="last-time">
                ${lastDate ? `Last: ${lastWeight || '—'}${state.unit} · ${lastDate}` : 'No history'}
              </div>
              <div>${levelUp ? '<span class="lvlup">LEVEL UP</span>' : ''}</div>
            </div>
          </div>`;
      }).join('')}

      <div class="divider-stamp">— FIN —</div>

      <div class="btn-row">
        <button class="btn btn-ghost" data-action="cancel-session">CANCEL</button>
        <button class="btn btn-rust" data-action="finish-session">FINISH SESSION ✓</button>
      </div>

      ${timer}
    </main>`;
}

function renderAnalytics() {
  if (state.sessions.length === 0) {
    return `<main>
      <div class="sec-head">
        <div>
          <div class="sec-num">ii.</div>

    </main>`;
  }

  const volume = weeklyVolume();
  const stalls = findStalling();
  const ready = findReadyToProgress();
  const prs = personalRecords();
  const totalSessions = state.sessions.length;
  const last7 = state.sessions.filter(s => new Date(s.date).getTime() >= Date.now() - 7*86400000).length;
  const totalVol = Math.round(totalVolume());

  // Volume targets per ACSM (10–20 sets/wk)
  const targets = {
    'Chest': [10, 17], 'Back': [10, 20], 'Shoulders': [10, 18],
    'Biceps': [10, 16], 'Triceps': [10, 16],
    'Quads': [6, 12], 'Hamstrings': [6, 12], 'Glutes': [6, 14], 'Calves': [4, 10]
  };

  return `
    <main>
      <div class="sec-head">
        <div>
          <div class="sec-num">ii.</div>
          <div class="sec-title">Stats</div>
        </div>
        <div class="sec-sub">PERFORMANCE</div>
      </div>

      <div class="stat-grid">
        <div class="stat-tile dark">
          <div class="stat-lbl">Total Sessions</div>
          <div class="stat-num">${totalSessions}</div>
          <div class="stat-sub">all-time</div>
        </div>
        <div class="stat-tile">
          <div class="stat-lbl">Last 7 Days</div>
          <div class="stat-num">${last7}<span class="stat-unit">/4</span></div>
          <div class="stat-sub">target ratio</div>
        </div>
        <div class="stat-tile">
          <div class="stat-lbl">Lifetime ${state.unit}·rep</div>
          <div class="stat-num">${totalVol > 999 ? (totalVol/1000).toFixed(1)+'k' : totalVol}</div>
          <div class="stat-sub">volume moved</div>
        </div>
        <div class="stat-tile dark">
          <div class="stat-lbl">PRs Set</div>
          <div class="stat-num">${Object.keys(prs).length}</div>
          <div class="stat-sub">exercises tracked</div>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <div class="card-title">Weekly Volume</div>
          <div class="card-meta">SETS · 7-DAY</div>
        </div>
        <div class="card-body">
          <p style="font-size:10px; opacity:0.65; margin-bottom:12px; line-height:1.6;">Per ACSM 2026: 10–20 working sets per muscle group per week is the hypertrophy sweet spot. Target zone shown in <span style="color:var(--olive); font-weight:700;">olive</span>.</p>
          ${Object.entries(volume).map(([muscle, sets]) => {
            const [min, max] = targets[muscle];
            const scale = max * 1.5;
            const widthPct = Math.min(100, (sets / scale) * 100);
            const minPct = (min / scale) * 100;
            const maxPct = (max / scale) * 100;
            let cls = 'under';
            if (sets >= min && sets <= max) cls = 'in-range';
            else if (sets > max) cls = 'over';
            return `
              <div class="bar-row">
                <div class="label">${muscle}</div>
                <div class="bar-track">
                  <div class="bar-fill ${cls}" style="width:${widthPct}%"></div>
                  <div class="bar-target" style="left:${minPct}%"></div>
                  <div class="bar-target" style="left:${maxPct}%"></div>
                </div>
                <div class="val">${sets.toFixed(1)}</div>
              </div>`;
          }).join('')}
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <div class="card-title">Flags & Insights</div>
          <div class="card-meta">ATTENTION</div>
        </div>
        <div class="card-body">
          <div class="flag-list">
            ${ready.length === 0 && stalls.length === 0 ? '<div class="empty" style="padding:20px 0;">No flags. Keep grinding.</div>' : ''}
            ${ready.map(ex => `
              <div class="flag-item">
                <div class="flag-icon up">↑</div>
                <div class="flag-text">
                  <div class="name">Time to add weight: ${ex.name}</div>
                  <div class="desc">You've beaten the rep range twice in a row. The 2-for-2 rule says bump the load by ${levelUpAmount(ex.id)}${state.unit}.</div>
                </div>
              </div>
            `).join('')}
            ${stalls.map(ex => `
              <div class="flag-item">
                <div class="flag-icon warn">!</div>
                <div class="flag-text">
                  <div class="name">Stalling: ${ex.name}</div>
                  <div class="desc">Same top weight for 3 sessions. Push harder, swap rep schemes, or check recovery.</div>
                </div>
              </div>
            `).join('')}
            ${last7 < 4 && totalSessions >= 4 ? `
              <div class="flag-item">
                <div class="flag-icon warn">○</div>
                <div class="flag-text">
                  <div class="name">Below 4 sessions this week</div>
                  <div class="desc">You're at ${last7}/4. Volume across the week matters more than any single session.</div>
                </div>
              </div>
            ` : ''}
            ${Object.entries(volume).filter(([m, s]) => s < targets[m][0] && s > 0).map(([m, s]) => `
              <div class="flag-item">
                <div class="flag-icon warn">↓</div>
                <div class="flag-text">
                  <div class="name">${m} under target</div>
                  <div class="desc">${s.toFixed(1)} sets this week, target ${targets[m][0]}–${targets[m][1]}. Add a set or two.</div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>

      ${Object.keys(prs).length > 0 ? `
      <div class="card">
        <div class="card-head">
          <div class="card-title">Personal Records</div>
          <div class="card-meta">EST. 1RM (EPLEY)</div>
        </div>
        <div class="card-body">
          ${Object.entries(prs).sort((a,b) => b[1].e1rm - a[1].e1rm).slice(0,8).map(([exId, pr]) => {
            const ex = exerciseById(exId);
            if (!ex) return '';
            return `
              <div class="bar-row" style="grid-template-columns: 1fr auto auto; gap:12px;">
                <div class="label">${ex.name}</div>
                <div class="val">${pr.weight}${state.unit} × ${pr.reps}</div>
                <div class="val" style="color:var(--rust);">≈${Math.round(pr.e1rm)}${state.unit}</div>
              </div>`;
          }).join('')}
        </div>
      </div>
      ` : ''}
    </main>`;
}

function attachHandlers() {
  // Bottom nav
  document.querySelectorAll('[data-view]').forEach(el => {
    el.addEventListener('click', () => {
      state.view = el.dataset.view;
      render();
    });
  });

  // Onboarding
  document.querySelectorAll('[data-action="onboard-next"]').forEach(el => {
    el.addEventListener('click', () => {
      // capture weight inputs if present
      document.querySelectorAll('[data-weight-input]').forEach(input => {
        const v = parseFloat(input.value);
        if (!isNaN(v) && v > 0) state.weights[input.dataset.weightInput] = v;
      });
      state.onboardStep = (state.onboardStep || 0) + 1;
      render();
    });
  });
  document.querySelectorAll('[data-action="onboard-back"]').forEach(el => {
    el.addEventListener('click', () => {
      state.onboardStep = Math.max(0, (state.onboardStep || 0) - 1);
      render();
    });
  });
  document.querySelectorAll('[data-action="set-unit"]').forEach(el => {
    el.addEventListener('click', () => {
      state.unit = el.dataset.unit;
      render();
    });
  });
  document.querySelectorAll('[data-action="finish-onboard"]').forEach(el => {
    el.addEventListener('click', () => {
      document.querySelectorAll('[data-weight-input]').forEach(input => {
        const v = parseFloat(input.value);
        if (!isNaN(v) && v > 0) state.weights[input.dataset.weightInput] = v;
      });
      state.onboarded = true;
      state.view = 'home';
      save();
      showToast('Setup complete. Pick a session to begin.');
      render();
    });
  });

  // Start a workout
  document.querySelectorAll('[data-action="start-day"]').forEach(el => {
    el.addEventListener('click', () => {
      const dayId = el.dataset.day;
      const day = PROGRAM[dayId];
      const entries = {};
      day.exercises.forEach(ex => {
        entries[ex.id] = Array.from({length: ex.sets}, () => ({ weight: null, reps: null, done: false }));
      });
      state.currentSession = {
        id: 'sess_' + Date.now(),
        dayId,
        date: new Date().toISOString(),
        entries
      };
      save();
      render();
    });
  });

  // Set inputs
  document.querySelectorAll('[data-set-input]').forEach(input => {
    input.addEventListener('change', (e) => {
      const [exId, setIdx, field] = input.dataset.setInput.split('|');
      const val = parseFloat(input.value);
      const i = parseInt(setIdx);
      if (!state.currentSession.entries[exId][i]) state.currentSession.entries[exId][i] = {};
      state.currentSession.entries[exId][i][field] = isNaN(val) ? null : val;
      save();
      // Re-render only the rep class — but easier just to render fully without losing focus on input
      // We don't re-render here to preserve input focus
    });
  });

  // Toggle set complete
  document.querySelectorAll('[data-action="toggle-set"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const [exId, setIdx, restSec] = btn.dataset.set.split('|');
      const i = parseInt(setIdx);
      // Capture current input values first
      document.querySelectorAll('[data-set-input]').forEach(inp => {
        const [eId, sIdx, fld] = inp.dataset.setInput.split('|');
        const v = parseFloat(inp.value);
        if (!state.currentSession.entries[eId][parseInt(sIdx)]) state.currentSession.entries[eId][parseInt(sIdx)] = {};
        state.currentSession.entries[eId][parseInt(sIdx)][fld] = isNaN(v) ? null : v;
      });
      const set = state.currentSession.entries[exId][i];
      set.done = !set.done;
      if (set.done) {
        // Start rest timer
        startRestTimer(parseInt(restSec));
      }
      save();
      render();
    });
  });

  // Skip rest
  document.querySelectorAll('[data-action="skip-rest"]').forEach(b => {
    b.addEventListener('click', stopRestTimer);
  });

  // Cancel session
  document.querySelectorAll('[data-action="cancel-session"]').forEach(b => {
    b.addEventListener('click', () => {
      if (confirm('Discard this session? Logged sets will be lost.')) {
        state.currentSession = null;
        stopRestTimer();
        save();
        render();
      }
    });
  });

  // Finish session
  document.querySelectorAll('[data-action="finish-session"]').forEach(b => {
    b.addEventListener('click', () => {
      // Capture all input values
      document.querySelectorAll('[data-set-input]').forEach(inp => {
        const [eId, sIdx, fld] = inp.dataset.setInput.split('|');
        const v = parseFloat(inp.value);
        if (!state.currentSession.entries[eId][parseInt(sIdx)]) state.currentSession.entries[eId][parseInt(sIdx)] = {};
        state.currentSession.entries[eId][parseInt(sIdx)][fld] = isNaN(v) ? null : v;
      });
      // Filter to only completed sets going into history? No, keep all so user can review.
      // But also update weights if user has been beating top of range
      const session = state.currentSession;
      Object.entries(session.entries).forEach(([exId, sets]) => {
        const completed = sets.filter(s => s.done && s.weight);
        if (completed.length > 0) {
          // Update working weight to most recent top weight used
          const topWeight = Math.max(...completed.map(s => s.weight));
          state.weights[exId] = topWeight;
        }
      });
      state.sessions.push(session);
      state.currentSession = null;
      stopRestTimer();
      save();
      // Auto-suggest level-ups
      const ready = findReadyToProgress();
      if (ready.length > 0) {
        showToast(`Session logged. ${ready.length} exercise${ready.length>1?'s':''} ready to level up. Check Stats.`, 3500);
      } else {
        showToast('Session logged.');
      }
      state.view = 'home';
      render();
    });
  });

  // Settings: switch unit (with conversion)
  document.querySelectorAll('[data-action="switch-unit"]').forEach(b => {
    b.addEventListener('click', () => {
      const newUnit = b.dataset.unit;
      if (newUnit === state.unit) return;
      const factor = newUnit === 'kg' ? 0.4536 : 2.2046;
      Object.keys(state.weights).forEach(k => {
        state.weights[k] = Math.round(state.weights[k] * factor * 2) / 2;
      });
      // Convert in sessions too
      state.sessions.forEach(s => {
        Object.values(s.entries || {}).forEach(sets => {
          sets.forEach(set => {
            if (set.weight) set.weight = Math.round(set.weight * factor * 2) / 2;
          });
        });
      });
      state.unit = newUnit;
      save();
      showToast('Units converted.');
      render();
    });
  });

  // Settings: save weights
  document.querySelectorAll('[data-action="save-weights"]').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('[data-weight-input]').forEach(inp => {
        const v = parseFloat(inp.value);
        if (!isNaN(v) && v > 0) state.weights[inp.dataset.weightInput] = v;
        else delete state.weights[inp.dataset.weightInput];
      });
      save();
      showToast('Weights saved.');
    });
  });

  // Export
  document.querySelectorAll('[data-action="export-data"]').forEach(b => {
    b.addEventListener('click', () => {
      const data = {
        onboarded: state.onboarded,
        unit: state.unit,
        weights: state.weights,
        sessions: state.sessions,
        exportedAt: new Date().toISOString()
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ironlog-backup-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Backup downloaded.');
    });
  });

  // Import
  document.querySelectorAll('[data-action="import-data"]').forEach(b => {
    b.addEventListener('click', () => {
      document.getElementById('import-file').click();
    });
  });
  const importFile = document.getElementById('import-file');
  if (importFile) {
    importFile.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          if (confirm('This will REPLACE your current data. Continue?')) {
            if (data.unit) state.unit = data.unit;
            if (data.weights) state.weights = data.weights;
            if (data.sessions) state.sessions = data.sessions;
            state.onboarded = true;
            save();
            showToast('Data imported.');
            render();
          }
        } catch(err) {
          alert('Invalid file.');
        }
      };
      reader.readAsText(file);
    });
  }

  // Reset
  document.querySelectorAll('[data-action="reset-all"]').forEach(b => {
    b.addEventListener('click', () => {
      if (confirm('PERMANENTLY delete all data? This cannot be undone.')) {
        if (confirm('Really? All weights, sessions, and history will be erased.')) {
          localStorage.removeItem(STORAGE_KEY);
          state = {
            onboarded: false,
            unit: 'lb',
            weights: {},
            sessions: [],
            currentSession: null,
            view: 'home',
            onboardStep: 0,
            restTimer: null,
            toast: null
          };
          render();
        }
      }
    });
  });

  // View past session — simple alert summary
  document.querySelectorAll('[data-action="view-session"]').forEach(b => {
    b.addEventListener('click', () => {
      const id = b.dataset.sessionId;
      const sess = state.sessions.find(s => s.id === id);
      if (!sess) return;
      const day = PROGRAM[sess.dayId];
      let summary = `${day.name} — ${fmtDate(sess.date)} ${fmtTime(sess.date)}\n\n`;
      day.exercises.forEach(ex => {
        const sets = sess.entries[ex.id] || [];
        const lines = sets.map((s, i) => s.done ? `  Set ${i+1}: ${s.weight || '—'}${state.unit} × ${s.reps || '—'}` : `  Set ${i+1}: skipped`).join('\n');
        summary += `${ex.name}\n${lines}\n\n`;
      });
      alert(summary);
    });
  });
}

// ---------------------------------------------------------------------------
// REST TIMER
// ---------------------------------------------------------------------------
let timerInterval = null;
function startRestTimer(seconds) {
  stopRestTimer();
  state.restTimer = { remaining: seconds };
  timerInterval = setInterval(() => {
    if (state.restTimer && state.restTimer.remaining > 0) {
      state.restTimer.remaining--;
      // Update only the timer DOM, not full render, to keep focus
      const t = document.querySelector('.rest-timer .time');
      if (t) {
        const mm = Math.floor(state.restTimer.remaining / 60);
        const ss = state.restTimer.remaining % 60;
        t.textContent = `${mm}:${ss.toString().padStart(2,'0')}`;
        if (state.restTimer.remaining === 0) {
          // Vibrate if supported
          if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
          stopRestTimer();
          render();
        }
      }
    }
  }, 1000);
}
function stopRestTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = null;
  state.restTimer = null;
}

// ---------------------------------------------------------------------------
// BOOT
// ---------------------------------------------------------------------------
load();
render();

// Prevent accidental page leave during session
window.addEventListener('beforeunload', (e) => {
  if (state.currentSession) {
    e.preventDefault();
    e.returnValue = '';
  }
});
</script>
</body>
</html>
